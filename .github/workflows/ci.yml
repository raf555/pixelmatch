name: CI

on:
  push:
    branches: [release/v7]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: -race
          # The race detector needs cgo, which Windows runners don't set up.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ${{ matrix.race }} ./...
      - if: runner.os == 'Linux'
        run: go test ./...
        env:
          GOAMD64: v3
