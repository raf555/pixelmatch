name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
          # Apple Silicon runner: checks that arm64, where Go may fuse
          # multiply-adds, produces the same bytes as amd64.
          - os: macos-latest
            race: -race
          # The race detector needs cgo, which Windows runners don't set up.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ${{ matrix.race }} ./...
      - if: runner.os == 'Linux'
        run: go test ./...
        env:
          GOAMD64: v3
